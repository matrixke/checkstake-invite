<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1c1b19" />
    <meta name="color-scheme" content="dark" />
    <title>Checkstake — Chess that pays</title>
    <meta
      name="description"
      content="Checkstake is a competitive chess platform where skill turns into earnings. Now piloting in Kenya."
    />
    <meta name="robots" content="noindex,nofollow" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Checkstake" />
    <meta property="og:title" content="Checkstake — Chess that pays" />
    <meta
      property="og:description"
      content="A competitive chess platform where skill turns into earnings. Piloting in Kenya."
    />
    <meta property="og:url" content="https://matrixke.github.io/checkstake-invite/" />
    <meta property="og:image" content="https://matrixke.github.io/checkstake-invite/og-survey.jpg?v=2" />
    <meta property="og:image:secure_url" content="https://matrixke.github.io/checkstake-invite/og-survey.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1376" />
    <meta property="og:image:height" content="768" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Checkstake — Chess that pays" />
    <meta
      name="twitter:description"
      content="A competitive chess platform where skill turns into earnings. Piloting in Kenya."
    />
    <meta name="twitter:image" content="https://matrixke.github.io/checkstake-invite/og-survey.jpg?v=2" />

    <base href="https://matrixke.github.io/checkstake-invite/" />
    <link rel="icon" href="/checkstake-invite/brand/mark-only-green.png" type="image/png" />
    <link rel="apple-touch-icon" href="/checkstake-invite/brand/mark-only-green.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #1c1b19;
        --card: #262421;
        --text: #f3efe8;
        --muted: #a8a29a;
        --dim: #78716c;
        --play: #81b64c;
        --play-fg: #14200a;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        overscroll-behavior: none;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        min-height: 100svh;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background:
          radial-gradient(ellipse 80% 45% at 50% -8%, rgba(129, 182, 76, 0.26), transparent 68%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding:
          max(1rem, env(safe-area-inset-top, 0px))
          max(1rem, env(safe-area-inset-right, 0px))
          max(1rem, env(safe-area-inset-bottom, 0px))
          max(1rem, env(safe-area-inset-left, 0px));
      }

      .card {
        width: min(100%, 26rem);
        border: 1px solid var(--border);
        border-radius: 1.25rem;
        overflow: hidden;
        background: var(--card);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .hero-wrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #111;
        overflow: hidden;
      }

      .hero {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .body {
        padding: 1.25rem 1.35rem calc(1.35rem + env(safe-area-inset-bottom, 0px));
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 0.9rem;
      }

      .brand img {
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        border-radius: 0.55rem;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }

      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .tag {
        margin: 0.2rem 0 0;
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.3;
      }

      .copy {
        margin: 0 0 1.15rem;
        line-height: 1.5;
        color: var(--muted);
        font-size: 0.95rem;
      }

      a.cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        width: 100%;
        min-height: 3rem;
        padding: 0.85rem 1rem;
        border-radius: 0.85rem;
        background: var(--play);
        color: var(--play-fg);
        font-size: 1rem;
        font-weight: 700;
        text-decoration: none;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        transition: transform 120ms ease-out, filter 120ms ease-out;
      }

      a.cta:active {
        transform: scale(0.97);
        filter: brightness(0.95);
      }

      @media (hover: hover) and (pointer: fine) {
        a.cta:hover {
          filter: brightness(1.06);
        }
      }

      .note {
        margin: 0.85rem 0 0;
        text-align: center;
        font-size: 0.7rem;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="hero-wrap">
        <img
          class="hero"
          src="/checkstake-invite/og-survey.jpg"
          alt="Checkstake"
          width="1376"
          height="768"
          decoding="async"
        />
      </div>
      <div class="body">
        <div class="brand">
          <img
            src="/checkstake-invite/brand/mark-only-green.png"
            alt=""
            width="40"
            height="40"
            decoding="async"
          />
          <div>
            <h1>Checkstake</h1>
            <p class="tag">Competitive chess · Real earnings</p>
          </div>
        </div>
        <p class="copy">
          Checkstake is a chess platform built so players can compete and earn. We are currently
          piloting in Kenya — join early and tell us how you want to play.
        </p>
        <a class="cta" href="https://forms.gle/FuNVjKKuPASwY3Qc7" rel="noopener">
          Join the Kenya pilot <span aria-hidden="true">→</span>
        </a>
        <p class="note">Short intake form · about 3 minutes</p>
      </div>
    </main>
  </body>
</html>
